<script>

/* =========================
   HASSNAIN HUB - FINAL JS
   ========================= */


/* ---------- DAILY IMAGE LIMIT ---------- */

const IMAGE_LIMIT = 5;

function todayKey(){
    return new Date().toISOString().slice(0,10);
}

function getImageCount(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem("hh_image_count") || "{}"
            );

        if(data.date !== todayKey()){
            return 0;
        }

        return Number(data.count || 0);

    }catch(e){

        return 0;

    }
}

function setImageCount(count){

    localStorage.setItem(
        "hh_image_count",
        JSON.stringify({
            date: todayKey(),
            count: count
        })
    );

}

function updateImageCounter(){

    const left =
        Math.max(
            0,
            IMAGE_LIMIT - getImageCount()
        );

    const el =
        document.getElementById("imageCounter");

    if(el){

        el.textContent =
            left +
            " image" +
            (left === 1 ? "" : "s") +
            " remaining today.";

    }

}

updateImageCounter();


/* ---------- IMAGE VARIABLES ---------- */

let selectedFile = null;
let generatedDataUrl = "";


/* ---------- PHOTO SELECT ---------- */

const imageFile =
    document.getElementById("imageFile");


if(imageFile){

    imageFile.addEventListener(
        "change",
        function(){

            selectedFile =
                this.files && this.files[0]
                ? this.files[0]
                : null;

            const fileText =
                document.getElementById("fileText");

            const preview =
                document.getElementById("sourcePreview");

            const sourceImg =
                document.getElementById("sourceImg");


            if(!selectedFile){

                fileText.textContent =
                    "📷 Choose your photo";

                preview.classList.add("hidden");

                return;

            }


            if(!selectedFile.type.startsWith("image/")){

                selectedFile = null;

                fileText.textContent =
                    "📷 Choose your photo";

                preview.classList.add("hidden");

                alert("Please select an image file.");

                return;

            }


            fileText.textContent =
                "📷 " + selectedFile.name;


            sourceImg.src =
                URL.createObjectURL(selectedFile);


            preview.classList.remove("hidden");

        }
    );

}


/* ---------- FILE TO DATA URL ---------- */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(reader.result);

            reader.onerror =
                () => reject(
                    new Error("Could not read image.")
                );

            reader.readAsDataURL(file);

        }
    );

}


/* ---------- AI IMAGE GENERATOR ---------- */

async function generateImage(){

    const status =
        document.getElementById("imageStatus");

    const button =
        document.getElementById("generateBtn");

    const prompt =
        document
        .getElementById("imagePrompt")
        .value
        .trim();


    const used =
        getImageCount();


    /* Limit */

    if(used >= IMAGE_LIMIT){

        status.className =
            "status err";

        status.textContent =
            "Daily limit reached. Please try again tomorrow.";

        return;

    }


    /* Photo required */

    if(!selectedFile){

        status.className =
            "status err";

        status.textContent =
            "📸 Your own photo is required before generating.";

        return;

    }


    /* Prompt required */

    if(!prompt){

        status.className =
            "status err";

        status.textContent =
            "Please describe what you want in the image.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Generating...";


    status.className =
        "status";

    status.textContent =
        "✨ AI is editing your photo. Please wait...";


    try{

        /*
         Convert the user's photo into
         a data URL.

         Puter officially supports data-URI
         input images for image-to-image.
        */

        const photoData =
            await fileToDataURL(selectedFile);


        /*
         Generate/edit image directly
         through Puter txt2img.

         IMPORTANT:
         The generated image is returned
         as an HTMLImageElement and is shown
         directly on this same page.
        */

        const image =
            await puter.ai.txt2img(

            prompt,

            {

                model:
                    "gemini-3.1-flash-image-preview",

                input_image:
                    photoData,

                input_image_mime_type:
                    selectedFile.type || "image/jpeg"

            }

            );


        if(!image){

            throw new Error(
                "No image returned."
            );

        }


        /*
         Keep generated image on
         the same website.
        */

        generatedDataUrl =
            image.src;


        const generatedImg =
            document.getElementById(
                "generatedImg"
            );


        generatedImg.src =
            generatedDataUrl;


        document
            .getElementById("resultPreview")
            .classList.remove("hidden");


        /* Count only successful generation */

        setImageCount(
            used + 1
        );


        updateImageCounter();


        status.className =
            "status ok";

        status.textContent =
            "✅ Image generated successfully on Hassnain Hub.";


    }catch(error){

        console.error(
            "IMAGE ERROR:",
            error
        );


        status.className =
            "status err";


        status.textContent =
            "❌ Image could not be generated. Please try again. If Puter asks for sign-in, complete it and return to this page.";

    }


    button.disabled = false;

    button.textContent =
        "✨ Generate Image";

}


/* ---------- SAVE IMAGE ---------- */

async function saveImage(){

    if(!generatedDataUrl){

        alert(
            "Please generate an image first."
        );

        return;

    }


    try{

        /*
         Android browsers may support
         Web Share API.
        */

        const response =
            await fetch(
                generatedDataUrl
            );


        const blob =
            await response.blob();


        const file =
            new File(
                [blob],
                "hassnain-ai-image.png",
                {
                    type:
                        blob.type || "image/png"
                }
            );


        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                title:
                    "Hassnain AI Image",

                files:
                    [file]

            });

            return;

        }


    }catch(error){

        console.log(
            "Share unavailable:",
            error
        );

    }


    /*
     Fallback download.
    */

    const link =
        document.createElement("a");


    link.href =
        generatedDataUrl;


    link.download =
        "hassnain-ai-image.png";


    document.body.appendChild(link);


    link.click();


    link.remove();

}


/* ---------- OPEN GENERATED IMAGE ---------- */

function openGenerated(){

    if(!generatedDataUrl){

        return;

    }


    /*
     Open the image only when
     user presses Open Image.
    */

    window.open(
        generatedDataUrl,
        "_blank"
    );

}


/* ---------- CLEAR IMAGE TOOL ---------- */

function clearImageTool(){

    selectedFile = null;

    generatedDataUrl = "";


    const file =
        document.getElementById(
            "imageFile"
        );

    if(file){

        file.value = "";

    }


    document.getElementById(
        "imagePrompt"
    ).value = "";


    document.getElementById(
        "fileText"
    ).textContent =
        "📷 Choose your photo";


    document
        .getElementById("sourcePreview")
        .classList.add("hidden");


    document
        .getElementById("resultPreview")
        .classList.add("hidden");


    const status =
        document.getElementById(
            "imageStatus"
        );


    status.className =
        "status";


    status.textContent =
        "Upload a photo and enter an idea.";

}


/* =========================
   CALCULATOR
   ========================= */


/* ---------- UNIT CONVERTER ---------- */

function convertUnit(){

    const value =
        parseFloat(
            document.getElementById(
                "unitValue"
            ).value
        );


    const from =
        document.getElementById(
            "unitFrom"
        ).value;


    const to =
        document.getElementById(
            "unitTo"
        ).value;


    const resultBox =
        document.getElementById(
            "unitResult"
        );


    if(!Number.isFinite(value)){

        resultBox.className =
            "result status err";

        resultBox.textContent =
            "Enter a valid number.";

        return;

    }


    const meters = {

        m:
            value,

        km:
            value * 1000,

        ft:
            value * 0.3048

    }[from];


    const result = {

        m:
            meters,

        km:
            meters / 1000,

        ft:
            meters / 0.3048

    }[to];


    const names = {

        m:
            "meters",

        km:
            "kilometers",

        ft:
            "feet"

    };


    resultBox.className =
        "result status ok";


    resultBox.textContent =
        value +
        " " +
        names[from] +
        " = " +
        Number(
            result.toFixed(8)
        ) +
        " " +
        names[to];

}


/* ---------- LAND AREA ---------- */

function calculateArea(){

    const length =
        parseFloat(
            document.getElementById(
                "landLength"
            ).value
        );


    const width =
        parseFloat(
            document.getElementById(
                "landWidth"
            ).value
        );


    const unit =
        document.getElementById(
            "landUnit"
        ).value;


    const target =
        document.getElementById(
            "areaUnit"
        ).value;


    const resultBox =
        document.getElementById(
            "areaResult"
        );


    if(
        !Number.isFinite(length) ||
        !Number.isFinite(width) ||
        length < 0 ||
        width < 0
    ){

        resultBox.className =
            "result status err";

        resultBox.textContent =
            "Enter valid length and width.";

        return;

    }


    const factor = {

        m:
            1,

        ft:
            0.3048,

        km:
            1000

    }[unit];


    const squareMeters =
        length *
        factor *
        width *
        factor;


    const result = {

        m2:
            squareMeters,

        ft2:
            squareMeters /
            0.09290304,

        km2:
            squareMeters /
            1000000

    }[target];


    const names = {

        m2:
            "m²",

        ft2:
            "ft²",

        km2:
            "km²"

    };


    resultBox.className =
        "result status ok";


    resultBox.textContent =
        "Area = " +
        Number(
            result.toFixed(8)
        ) +
        " " +
        names[target];

}


/* ---------- PERCENTAGE ---------- */

function percentage(){

    const obtained =
        parseFloat(
            document.getElementById(
                "marksGot"
            ).value
        );


    const total =
        parseFloat(
            document.getElementById(
                "marksTotal"
            ).value
        );


    const resultBox =
        document.getElementById(
            "percentResult"
        );


    if(
        !Number.isFinite(obtained) ||
        !Number.isFinite(total) ||
        total <= 0 ||
        obtained < 0
    ){

        resultBox.className =
            "result status err";

        resultBox.textContent =
            "Enter valid marks.";

        return;

    }


    resultBox.className =
        "result status ok";


    resultBox.textContent =
        "Percentage: " +
        (
            (obtained / total) *
            100
        ).toFixed(2) +
        "%";

}


/* =========================
   HASSNAIN AI CHAT
   NO WEBSITE-SIDE DAILY LIMIT
   ========================= */


/* ---------- ADD CHAT MESSAGE ---------- */

function addMessage(
    type,
    text
){

    const box =
        document.getElementById(
            "chatBox"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "msg " + type;


    message.textContent =
        text;


    box.appendChild(
        message
    );


    box.scrollTop =
        box.scrollHeight;


    return message;

}


/* ---------- SEND CHAT ---------- */

async function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );


    const button =
        document.getElementById(
            "sendBtn"
        );


    const status =
        document.getElementById(
            "chatStatus"
        );


    const question =
        input.value.trim();


    if(!question){

        status.className =
            "status err";

        status.textContent =
            "Please write a question.";

        return;

    }


    addMessage(
        "user",
        question
    );


    input.value = "";


    button.disabled = true;

    button.textContent =
        "Thinking...";


    status.className =
        "status";

    status.textContent =
        "Hassnain AI is thinking...";


    try{


        /*
         NO LOCAL DAILY LIMIT.

         The user can keep asking questions.
         Actual provider/account limits,
         if any, are controlled by Puter.
        */


        const response =
            await puter.ai.chat(

                question,

                {

                    model:
                        "gpt-5.6-luna"

                }

            );


        let answer = "";


        if(
            typeof response ===
            "string"
        ){

            answer =
                response;

        }else{

            answer =
                response?.message?.content ||
                response?.message?.text ||
                "";

        }


        if(
            Array.isArray(answer)
        ){

            answer =
                answer
                .map(
                    item =>
                        item.text || ""
                )
                .join("");

        }


        if(!answer){

            answer =
                "Sorry, no answer was returned. Please try again.";

        }


        addMessage(
            "ai",
            String(answer)
        );


        status.className =
            "status ok";

        status.textContent =
            "✅ Answer received.";


    }catch(error){

        console.error(
            "CHAT ERROR:",
            error
        );


        addMessage(

            "ai",

            "معذرت، اس وقت AI سروس جواب نہیں دے رہی۔ اگر Puter sign-in مانگے تو sign-in مکمل کریں اور دوبارہ سوال بھیجیں۔"

        );


        status.className =
            "status err";


        status.textContent =
            "AI service could not respond. Please try again.";

    }


    button.disabled = false;

    button.textContent =
        "Send Question →";

}


/* ---------- CLEAR CHAT ---------- */

function clearChat(){

    document.getElementById(
        "chatBox"
    ).innerHTML =

        '<div class="msg ai">' +
        'Assalam-o-Alaikum! میں Hassnain AI ہوں۔ اپنا سوال لکھیں۔' +
        '</div>';


    document.getElementById(
        "chatStatus"
    ).className =
        "status";


    document.getElementById(
        "chatStatus"
    ).textContent =
        "Ready.";

}


/* ---------- ENTER TO SEND ---------- */

const chatInput =
    document.getElementById(
        "chatInput"
    );


if(chatInput){

    chatInput.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendChat();

            }

        }
    );

}


/* ---------- START ---------- */

console.log(
    "Hassnain Hub loaded successfully."
);

             </script>
